<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Nosso primeiro site</title>
</head>

<body>
    <header>
        <h1>Meu blog</h1>
        <p>Vou compartilhar conhecimentos com você</p>
        <img src="https://www.superprof.com.br/blog/como-programar/" alt="imagem um">
    </header>
    <main>
        <h2>Meu primeiro post</h2>
        <p>Por: SEU NOME</p>
        <p>Boas vindas ao meu Blog, aqui vou
            compartilhar dicas com você!
        </p>
        <button>💗 <span>0</span></button>
        <button>🥺​ <span>0</span></button>
        <button>😐​ ​<span>0</span></button>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");
    botoes.forEach(function (botao) {
        botoes.addEventListener("click", botaoClicado);
        function botaoClicado() {
            let texto = botoes.querySelector("span");
            texto.textContent++;
        }
    })


</script>

</html>
