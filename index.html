<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Nosso primeiro site</title>
</head>

<body>
    <header>
        <h1>Meu blog</h1>
        <p>Vou compartilhar conhecimentos com você</p>
        <img src=" https://static.wikia.nocooke.net/truskawkowe-ciastko/images/6/6f/Truskawkowe_Ciastko.jpg/revision/latest/scale-to-width-down/225?cb=20131217141039&path-prefix=pl"
            alt="imagem um">
    </header>
    <main>
        <h2>Meu primeiro post</h2>
        <p>Por: SEU NOME</p>
        <p>Boas vindas ao meu Blog, aqui vou
            compartilhar dicas com você!
        </p>
        <button>💗<span>0</span></button>
    </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventlistener("click", botaoClicado);
    function botaoClicado() {
        let texto = botao.querySelector("span");
        texto.textContent++;
    }
</script>

</html>
